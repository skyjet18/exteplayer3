# Settings of the SonarCloud analysis (.github/workflows/sonarcloud.yml).
# Organization and project key are not here: the workflow takes them from
# the repository variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY.
sonar.projectName=exteplayer3

sonar.sources=.
sonar.sourceEncoding=UTF-8

# not analysed: the host tests, third-party code (FFmpeg excerpts,
# flv2mpeg4), the prebuilt packages and the CI files
sonar.exclusions=tests/**,external/**,ipk/**,.github/**

# no coverage report is uploaded; without this the quality gate fails
# every branch and pull request on "coverage on new code"
sonar.coverage.exclusions=**
