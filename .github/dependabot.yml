# Keeps the GitHub Actions used in .github/workflows/ up to date (they are
# pinned to commits, Dependabot updates the commit and the version comment).
# Every second month on the 1st, all updates in one pull request.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 1 */2 *"
      timezone: "Europe/Berlin"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
